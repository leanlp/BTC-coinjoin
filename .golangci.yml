run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - typecheck

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too noisy for forensics structs
  staticcheck:
    checks: ["all", "-SA1019"]  # Allow deprecated for backwards compat

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    # Test files can have longer functions
    - path: _test\.go
      linters:
        - errcheck
    # Allow unused parameters in interface implementations
    - linters:
        - unused
      source: "^func \\(.*\\) .*(models\\.|Transaction)"

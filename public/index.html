<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawBlock CUDA Analytics - Real-time Mempool</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: #1a1f2e;
            --surface-hover: #22283a;
            --text-primary: #f0f2f5;
            --text-secondary: #8b94a5;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #ffa502;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 1.5rem 0;
            text-align: center;
            background: linear-gradient(180deg, rgba(26, 31, 46, 0.8) 0%, transparent 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--danger);
            box-shadow: 0 0 10px var(--danger);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        main {
            width: 95%;
            max-width: 1600px;
        }

        .table-container {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: top;
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: rgba(255, 255, 255, 0.02);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tx-row {
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        .tx-row:hover {
            background-color: var(--surface-hover);
        }

        .tx-row.expanded {
            background-color: rgba(0, 255, 204, 0.05);
            border-left: 3px solid var(--accent);
        }

        /* Detail row for JSON dump */
        .detail-row {
            display: none;
            background-color: #0d111a;
        }

        .detail-row.open {
            display: table-row;
        }

        .detail-cell {
            padding: 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .detail-content {
            padding: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a5b1c2;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
            margin: 0;
        }

        .json-key {
            color: #f368e0;
        }

        .json-string {
            color: #1dd1a1;
        }

        .json-number {
            color: #feca57;
        }

        .json-boolean {
            color: #ff9f43;
        }

        .txid {
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        .txid:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            background-color: rgba(255, 255, 255, 0.1);
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* Hardware */
        .badge.cuda {
            background: rgba(0, 255, 204, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        /* Layer 1: Deterministic */
        .badge.l1 {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.5);
        }

        /* Layer 2: Probabilistic */
        .badge.l2 {
            background: rgba(160, 32, 240, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(160, 32, 240, 0.5);
        }

        /* Layer 3: Policy / Suspects */
        .badge.l3 {
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.5);
        }

        /* Layer 4 & 6 & 7 & 8: Intelligence & High Risk */
        .badge.l-risk {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.5);
        }

        .badge.none {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-bar {
            width: 80px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
        }

        .score-fill {
            height: 100%;
            background-color: var(--success);
            transition: width 0.5s ease;
        }

        .score-fill.low {
            background-color: var(--danger);
        }

        .score-fill.medium {
            background-color: var(--warning);
        }

        .time-ms {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #d1d8e0;
        }

        /* Value grid for showing stats */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .stat-grid span {
            color: var(--text-primary);
        }

        @keyframes unshift {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .new-row {
            animation: unshift 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>

<body>

    <header>
        <h1>RawBlock <span>CUDA Core</span></h1>
        <div class="status-container">
            <div id="statusIndicator" class="status-dot"></div>
            <span id="statusText">Connecting to Stream...</span>
        </div>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 5px;">Click any row to view complete
            backend JSON payload</p>
    </header>

    <main>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="15%">Transaction ID</th>
                        <th width="15%">Metrics</th>
                        <th width="15%">Privacy & Inference</th>
                        <th width="45%">Forensics Flags (L1-L8)</th>
                        <th width="10%">Compute</th>
                    </tr>
                </thead>
                <tbody id="txTableBody">
                    <!-- Rows will be injected here via websocket -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const tableBody = document.getElementById('txTableBody');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const maxRows = 25;

        // Syntax highlighting for JSON
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 4);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-boolean';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/api/v1/stream`;

            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusIndicator.classList.add('connected');
                statusText.innerText = 'Connected (Live Mempool Stream)';
            };

            ws.onclose = () => {
                statusIndicator.classList.remove('connected');
                statusText.innerText = 'Disconnected. Reconnecting...';
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                ws.close();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addTransactionRow(data);
                } catch (e) {
                    console.error('Failed to parse WS message:', e);
                }
            };
        }

        function getScoreColorClass(score) {
            if (score <= 33) return 'low';
            if (score <= 66) return 'medium';
            return 'high';
        }

        // JS numbers are 64-bit floats, bitwise operators (<<, &) treat them as 32-bit signed ints.
        // We MUST use BigInt for 64-bit flag masks.
        const F = {
            IsSegWit: 1n << 0n,
            IsTaproot: 1n << 1n,
            HasSchnorrSig: 1n << 2n,
            IsWhirlpoolStruct: 1n << 3n,

            LikelyChange: 1n << 10n,
            LikelyCollabConstruct: 1n << 11n,
            AddressReuse: 1n << 12n,
            HasRoundPayment: 1n << 13n,
            IsConsolidation: 1n << 14n,
            IsBIP69: 1n << 15n,
            HighEntropy: 1n << 16n,
            SuspiciousFee: 1n << 17n,
            IsPeelChain: 1n << 18n,
            TimingAnomaly: 1n << 19n,

            IsMuSig2Suspect: 1n << 20n,
            IsPayjoinSuspect: 1n << 21n,
            IsSilentPayment: 1n << 22n,
            IsWasabiSuspect: 1n << 23n,
            IsJoinMarketBond: 1n << 24n,

            DustAttackSuspect: 1n << 25n,
            WeakMix: 1n << 26n,
            IsHubTransaction: 1n << 27n,
            DustConsolidation: 1n << 28n,
            HighTraceability: 1n << 29n,

            AncientUTXO: 1n << 30n,
            KnownService: 1n << 31n,
            IsMultisig: 1n << 32n,
            HasOPReturn: 1n << 33n,

            PostMixLeakage: 1n << 34n,
            BotBehavior: 1n << 35n,
            HighRisk: 1n << 36n,

            LightningChannel: 1n << 37n,
            IsCoinbase: 1n << 38n,
            StrategicConsolidation: 1n << 39n,

            // Phase 18 flags
            ScriptFingerprint: 1n << 40n,
            TaintPropagated: 1n << 41n,
            TemporalCorrelated: 1n << 42n,
            CrossChainLinked: 1n << 43n,
            MarkovScored: 1n << 44n,
            MempoolTracked: 1n << 45n,
        };

        function getForensicsLabels(flagsNum) {
            const flags = BigInt(flagsNum || 0);
            const labels = [];

            // L1
            if ((flags & F.IsSegWit) > 0n) labels.push('<span class="badge l1">SegWit</span>');
            if ((flags & F.IsTaproot) > 0n) labels.push('<span class="badge l1">Taproot</span>');
            if ((flags & F.HasSchnorrSig) > 0n) labels.push('<span class="badge l1">Schnorr</span>');
            if ((flags & F.IsWhirlpoolStruct) > 0n) labels.push('<span class="badge l1">Whirlpool Struct</span>');

            // L2
            if ((flags & F.LikelyChange) > 0n) labels.push('<span class="badge l2">Change Detected</span>');
            if ((flags & F.LikelyCollabConstruct) > 0n) labels.push('<span class="badge l2">CoinJoin Proxy</span>');
            if ((flags & F.AddressReuse) > 0n) labels.push('<span class="badge l2">Address Reuse</span>');
            if ((flags & F.HasRoundPayment) > 0n) labels.push('<span class="badge l2">Round Payment</span>');
            if ((flags & F.IsConsolidation) > 0n) labels.push('<span class="badge l2">Consolidation</span>');
            if ((flags & F.IsBIP69) > 0n) labels.push('<span class="badge l2">BIP69 Sorted</span>');
            if ((flags & F.HighEntropy) > 0n) labels.push('<span class="badge l2">High Entropy</span>');
            if ((flags & F.SuspiciousFee) > 0n) labels.push('<span class="badge l2">Fee Anomaly</span>');
            if ((flags & F.IsPeelChain) > 0n) labels.push('<span class="badge l2">Peel Chain</span>');
            if ((flags & F.TimingAnomaly) > 0n) labels.push('<span class="badge l2">Timing Anomaly</span>');

            // L3
            if ((flags & F.IsMuSig2Suspect) > 0n) labels.push('<span class="badge l3">MuSig2</span>');
            if ((flags & F.IsPayjoinSuspect) > 0n) labels.push('<span class="badge l3">PayJoin Suspect</span>');
            if ((flags & F.IsSilentPayment) > 0n) labels.push('<span class="badge l3">Silent Pymt</span>');
            if ((flags & F.IsWasabiSuspect) > 0n) labels.push('<span class="badge l3">WabiSabi</span>');
            if ((flags & F.IsJoinMarketBond) > 0n) labels.push('<span class="badge l3">JoinMarket Bond</span>');

            // Risk / Intel (L4/L6)
            if ((flags & F.DustAttackSuspect) > 0n) labels.push('<span class="badge l-risk">Dust Attack</span>');
            if ((flags & F.WeakMix) > 0n) labels.push('<span class="badge l-risk">Weak Mix</span>');
            if ((flags & F.IsHubTransaction) > 0n) labels.push('<span class="badge l-risk">Exchange Hub</span>');
            if ((flags & F.DustConsolidation) > 0n) labels.push('<span class="badge l-risk">Dust Cleanup</span>');
            if ((flags & F.HighTraceability) > 0n) labels.push('<span class="badge l-risk">Highly Traceable</span>');

            if ((flags & F.PostMixLeakage) > 0n) labels.push('<span class="badge l-risk">Post-Mix Leakage</span>');
            if ((flags & F.BotBehavior) > 0n) labels.push('<span class="badge l-risk">Bot Behavior</span>');
            if ((flags & F.HighRisk) > 0n) labels.push('<span class="badge l-risk" style="background:var(--danger);color:#fff">HIGH RISK ENTITY</span>');

            // Deep Intel (L5/L7/L8)
            if ((flags & F.AncientUTXO) > 0n) labels.push('<span class="badge l1">Ancient UTXO</span>');
            if ((flags & F.KnownService) > 0n) labels.push('<span class="badge l1">Service KYC</span>');
            if ((flags & F.IsMultisig) > 0n) labels.push('<span class="badge l2">Multisig</span>');
            if ((flags & F.HasOPReturn) > 0n) labels.push('<span class="badge l1">OP_RETURN</span>');
            if ((flags & F.LightningChannel) > 0n) labels.push('<span class="badge l1">Lightning Channel</span>');
            if ((flags & F.IsCoinbase) > 0n) labels.push('<span class="badge l2">Coinbase</span>');
            if ((flags & F.StrategicConsolidation) > 0n) labels.push('<span class="badge l-risk">Strategic Batching</span>');

            // Phase 18 Flags
            if ((flags & F.ScriptFingerprint) > 0n) labels.push('<span class="badge l1">Script Fingerprinted</span>');
            if ((flags & F.TaintPropagated) > 0n) labels.push('<span class="badge l-risk">Taint Flow Mapped</span>');
            if ((flags & F.TemporalCorrelated) > 0n) labels.push('<span class="badge l2">Temporal Corridor</span>');
            if ((flags & F.CrossChainLinked) > 0n) labels.push('<span class="badge l3">Cross-Chain Link</span>');
            if ((flags & F.MarkovScored) > 0n) labels.push('<span class="badge l-risk">Markov Absorption</span>');
            if ((flags & F.MempoolTracked) > 0n) labels.push('<span class="badge l1">ZMQ Telemetry</span>');

            if (labels.length === 0) {
                labels.push('<span class="badge none">Standard Tx</span>');
            }
            return labels.join('');
        }

        function toggleRow(txid) {
            const detailRow = document.getElementById(`detail-${txid}`);
            const mainRow = document.getElementById(`row-${txid}`);
            if (detailRow.classList.contains('open')) {
                detailRow.classList.remove('open');
                mainRow.classList.remove('expanded');
            } else {
                detailRow.classList.add('open');
                mainRow.classList.add('expanded');
            }
        }

        function extractImportantInference(inf) {
            if (!inf) return "N/A";
            return `
                <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">
                    ${inf.confidenceLevel ? `[${inf.confidenceLevel.toUpperCase()}]` : ''} 
                    LLR: ${inf.posteriorLlr ? inf.posteriorLlr.toFixed(2) : '0.00'}
                </div>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">
                    Cluster Mass: ${inf.clusterMass !== undefined ? inf.clusterMass.toFixed(2) : '-'} <br/>
                    Risk Node: ${inf.hasRiskNode ? '<span style="color:var(--danger)">True</span>' : 'False'}
                </div>
            `;
        }

        let rowIndexCounter = 0;

        function addTransactionRow(data) {
            rowIndexCounter++;
            const internalId = `${data.txid}-${rowIndexCounter}`;

            const mainTr = document.createElement('tr');
            mainTr.id = `row-${internalId}`;
            mainTr.className = 'tx-row new-row';
            mainTr.onclick = () => toggleRow(internalId);

            const shortTxid = `${data.txid.substring(0, 8)}...${data.txid.substring(data.txid.length - 8)}`;
            const scoreClass = getScoreColorClass(data.privacyScore || 0);
            const hardwareBadge = data.cudaOffloaded
                ? `<span class="badge cuda">⚡ RTX CUDA</span>`
                : `<span class="badge">CPU</span>`;

            const forensicsHtml = getForensicsLabels(data.heuristicFlags);
            const btcVol = ((data.totalIn || 0) / 100000000).toFixed(4);

            mainTr.innerHTML = `
                <td>
                    <a href="https://mempool.space/tx/${data.txid}" target="_blank" class="txid" onclick="event.stopPropagation()">${shortTxid}</a>
                </td>
                <td>
                    <div style="font-weight:600; font-size: 0.95rem; color: var(--text-primary);">${data.numInputs} In × ${data.numOutputs} Out</div>
                    <div class="stat-grid">
                        <div>Vol:</div> <div><span style="color:#d8b4fe">${btcVol} ₿</span></div>
                        <div>Fee:</div> <div><span style="color:#facc15">${data.fee} sats</span></div>
                        <div>Size:</div> <div><span>${data.vsize} vB</span></div>
                    </div>
                </td>
                <td>
                    <div class="score-container" style="margin-bottom: 5px;">
                        <div class="score-bar"><div class="score-fill ${scoreClass}" style="width: ${data.privacyScore || 0}%"></div></div>
                        <span style="font-weight: 600;">${data.privacyScore || 0}</span>
                    </div>
                    ${extractImportantInference(data.inference)}
                </td>
                <td>${forensicsHtml}</td>
                <td>
                    <div style="margin-bottom: 5px;">${hardwareBadge}</div>
                    <div class="time-ms">${data.processingTimeMs ? data.processingTimeMs.toFixed(2) : 0} ms</div>
                </td>
            `;

            // Create Detail Row (JSON dump)
            const detailTr = document.createElement('tr');
            detailTr.id = `detail-${internalId}`;
            detailTr.className = 'detail-row';

            const jsonDump = syntaxHighlight(data);

            detailTr.innerHTML = `
                <td colspan="5" class="detail-cell">
                    <pre class="detail-content">${jsonDump}</pre>
                </td>
            `;

            // Insert at top
            tableBody.prepend(detailTr);
            tableBody.prepend(mainTr);

            setTimeout(() => {
                mainTr.classList.remove('new-row');
            }, 500);

            // Cleanup old rows to prevent DOM bloat (each item is 2 rows: main + detail)
            while (tableBody.children.length > maxRows * 2) {
                tableBody.removeChild(tableBody.lastChild);
            }
        }

        connectWebSocket();
    </script>
</body>

</html>
